name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # format, lint, types, tests, build, and the package as an app installs it
    uses: mirafive/.github/.github/workflows/js-sdk.yml@6ae9b1ce535cc43b442c79de244f74b6ee207455

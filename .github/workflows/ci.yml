name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # format, lint, types, tests, build, and the package as an app installs it
    uses: mirafive/.github/.github/workflows/js-sdk.yml@a04ea8afe3f0c66d0cac7618681bda3b38516a1e

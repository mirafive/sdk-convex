name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # format, lint, types, tests, build, and the package as an app installs it
    uses: mirafive/.github/.github/workflows/js-sdk.yml@8fd9aaaaa1dbe9d0abc57f6174990f39cf6973bf

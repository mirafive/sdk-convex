name: PR title

# PRs are squash-merged, so the title becomes the commit on main: it must be a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: The description starts lowercase and has no trailing period.

# Merging a new version (package.json and its CHANGELOG.md section) to main releases it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mirafive/.github/.github/workflows/js-sdk-release.yml@a04ea8afe3f0c66d0cac7618681bda3b38516a1e
    permissions:
      contents: write
      id-token: write
    secrets: inherit

# Merging a new version (package.json and its CHANGELOG.md section) to main releases it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: mirafive/.github/.github/workflows/js-sdk-release.yml@8fd9aaaaa1dbe9d0abc57f6174990f39cf6973bf
    permissions:
      contents: write
      id-token: write
    secrets: inherit
